services:
  ros-sampler:
    build:
      context: .
      dockerfile: ./.devcontainer/Dockerfile
      args:
        SSH_PORT: 2822
    image: ros-sampler
    stdin_open: true
    container_name: ros-sampler
    hostname: ros-sampler
    tty: true
    pid: "host"
    ipc: "host"
    init: true
    network_mode: host
    extra_hosts:
      - "ros-sampler=127.0.0.1"
    environment:
      - TZ=Europe/Warsaw
      - ROS_ENABLE_AUTOSTART=1
      - ROS_BUILD_ON_STARTUP=on-failure
    volumes:
      - type: bind
        source: ./
        target: /mnt/local
        bind:
          create_host_path: false
      - type: bind
        source: ./.devcontainer/rex
        target: /etc/init.d/rex
        bind:
          create_host_path: false
      - type: bind
        source: "${REX_CONTAINER_AUTHORIZED_KEYS:-/dev/null}"
        target: /run/secrets/authorized_keys
        read_only: true # Make sure this stays read-only!
        bind:
          create_host_path: false
    restart: unless-stopped
